name: Build unsigned iOS IPA

# Titanium ships as an unsigned .ipa: there is no paid Apple Developer account
# behind this repo, so the archive is built with code signing switched off and
# the user signs it locally with Sideloadly (see README).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Must match the iOS project name expo prebuild derives from `name` in app.json.
  APP_NAME: Titanium

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          # The runner default is not always the newest image; pick the highest
          # version present so the build matches a current iOS SDK.
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          echo "SDKs:"
          xcodebuild -showsdks | grep iphoneos || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        run: npx pod-install

      - name: Build unsigned release archive
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "ios/${APP_NAME}.xcworkspace" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "build/${APP_NAME}.xcarchive" \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Package the .ipa
        run: |
          # xcodebuild -exportArchive needs a signing identity, so the payload is
          # zipped by hand instead. An .ipa is just Payload/<App>.app in a zip.
          set -euo pipefail
          APP_PATH="build/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle missing at $APP_PATH"
            ls -R build/${APP_NAME}.xcarchive/Products || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry "${APP_NAME}.ipa" Payload)
          ls -lh "build/${APP_NAME}.ipa"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: build/${{ env.APP_NAME }}.ipa
          if-no-files-found: error

      # A tag push cuts a real release; a manual run cuts a prerelease named
      # after the run number so test builds never overwrite a tagged one.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APP_NAME }}.ipa
          name: Titanium ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Titanium ${{ github.ref_name }}** - unsigned iOS build.

            This is a demo wallet. All balances are simulated, no blockchain is
            involved and no real funds exist anywhere in the app.

            ### Installing on iPhone from Windows
            1. Download `Titanium.ipa` below.
            2. Install [Sideloadly](https://sideloadly.io) and connect your iPhone.
            3. Drop the `.ipa` in, sign in with a free Apple ID, and hit Start.
            4. On the phone: Settings > General > VPN & Device Management > trust your developer certificate.

            A free Apple ID signature lasts 7 days; re-sign with Sideloadly, or
            use AltStore to refresh it automatically. See the README for detail.

      - name: Publish manual prerelease
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APP_NAME }}.ipa
          tag_name: build-${{ github.run_number }}
          name: Titanium manual build ${{ github.run_number }}
          prerelease: true
          body: |
            Unsigned iOS build from a manual workflow run (#${{ github.run_number }}),
            commit ${{ github.sha }}.

            Demo wallet - simulated balances only. Sign with Sideloadly to install.
